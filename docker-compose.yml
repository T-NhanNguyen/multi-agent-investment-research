services:
  investment-research:
    build: .
    image: investment-research-orchestrator
    container_name: investment_agents
    env_file:
      - .env
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount whole directory for hot-reload and access to all scripts
      - .:/app
      # GraphRAG .env mount (Bypassed for Mac testing due to E:/ path)
      # - E:/ai-workspace/projects/graphRAG-LlamaIndex/.env:/app/graphrag.env
      # Docker socket mount for sibling containers
      - /var/run/docker.sock:/var/run/docker.sock

    stdin_open: true
    tty: true

  monitoring-api:
    build: .
    image: investment-research-api
    container_name: investment_agents_monitoring_api
    command: python -m uvicorn api_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - .:/app
      # - E:/ai-workspace/projects/graphRAG-LlamaIndex/.env:/app/graphrag.env
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  crawl4ai:
    image: unclecode/crawl4ai:basic-amd64
    container_name: crawl4ai
    ports:
      - "11235:11235"
    shm_size: '2gb'
    environment:
      - CRAWL4AI_API_TOKEN=research_token_2026
    restart: always
